name: 인스타그램·스레드 게시 (매일 아침 8시)

# 새벽 '매일 실거래 갱신'이 만들어 둔 오늘 게시물(insta/posts.json)을 아침에 인스타그램과 스레드에 올립니다.
# GitHub 예약 실행은 정각에 몰려 늦어지거나 아예 빠지는 날이 있어 07:55 + 예비 08:35·09:20 세 번 걸어 둠 (이미 올린 게시물은 건너뜀)
# 갱신이 7시 넘어 끝난 날(장애로 예비 실행이 돈 날 등)은 갱신이 끝나면 자동으로 한 번 더 실행 (이미 올린 게시물은 건너뜀)
# 어느 경우든 1위 사진 카드(PC) 작업이 돌고 있으면 끝날 때까지(최대 30분) 기다린 뒤 게시
on:
  schedule:
    - cron: '55 22 * * *'   # 매일 07:55 KST
    - cron: '35 23 * * *'   # 08:35 KST 예비 (GitHub 가 예약 실행을 가끔 건너뛰어서. 이미 올린 건 건너뜀)
    - cron: '20 0 * * *'    # 09:20 KST 예비
  workflow_dispatch:         # Actions 탭에서 수동 실행 (이미 올린 게시물은 건너뜀)
  workflow_run:              # '매일 실거래 갱신'이 아침 7시 넘어 끝난 날(예비 실행·지연·수동)은 끝나면 자동 게시 (1위 사진 카드가 끝날 때까지 기다림)
    workflows: ['매일 실거래 갱신']
    types: [completed]

permissions:
  contents: write   # 1위 카드 카톡 '보낸 표시' 저장용
  actions: read     # 1위 사진 카드(PC) 작업 진행 확인용

concurrency:          # 두 실행이 동시에 돌면 서로 '아직 안 올렸다'고 보고 둘 다 올림 → 한 번에 하나씩 차례로
  group: insta-post
  cancel-in-progress: false

jobs:
  post:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 늦게 끝난 갱신 뒤 실행인지 확인 + 1위 사진 카드(PC) 끝날 때까지 기다리기
        id: late
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=Asia/Seoul date +%H)
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "$H" -lt 7 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo '7시 전이라 08시 예약 실행에 맡깁니다'; exit 0
          fi
          [ "${{ github.event_name }}" = "workflow_run" ] && sleep 120
          # PC 가 다른 작업(재무 수집 등) 중이라 사진 카드가 대기 중이면 최대 30분 기다림 → 그래도 안 끝나면 그림 카드로 진행
          for i in $(seq 1 30); do
            N=$(gh api "repos/${{ github.repository }}/actions/workflows/hero_photo.yml/runs?per_page=10" \
                --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting")] | length' || echo 0)
            [ "$N" = "0" ] && break
            echo "1위 사진 카드(PC) 작업이 아직 진행 중이라 기다립니다 ($i분)"; sleep 60
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.late.outputs.skip != 'true'
      - name: 1위 카드 카톡 (PC 가 꺼져 있어 아직 안 보냈으면 일반 배경 카드로)
        if: steps.late.outputs.skip != 'true'
        continue-on-error: true
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 hero_kakao.py
      - name: 인스타그램 자동 게시
        if: steps.late.outputs.skip != 'true'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 post_instagram.py
      - name: 스레드 자동 게시
        if: steps.late.outputs.skip != 'true'
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 post_threads.py

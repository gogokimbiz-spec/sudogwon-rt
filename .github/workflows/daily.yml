name: 매일 실거래 갱신

on:
  schedule:
    - cron: '11 20 * * *'   # 매일 05:11 KST
  workflow_dispatch:         # Actions 탭에서 수동 실행
    inputs:
      cy_weekly:
        description: '청약 주간 블로그 글·카톡도 지금 보내기'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 국토부 실거래 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python fetch.py
      - name: 지도 페이지 만들기
        env:
          WATCH_DAYS: ${{ vars.WATCH_DAYS }}
          WATCH_FIXED: ${{ vars.WATCH_FIXED }}
        run: |
          mkdir -p site
          python build.py rt_data.json site/index.html site/summary.json --standalone
          cp privacy.html site/ 2>/dev/null || true
          # 검색엔진 소유 확인 파일과 사이트맵 (있으면 같이 올림)
          for f in google*.html naver*.html sitemap.xml robots.txt; do [ -f "$f" ] && cp "$f" site/ || true; done
      - name: 시군구별 실거래가 페이지 만들기
        continue-on-error: true
        run: python build_regions.py rt_data.json site
      - name: 청약홈 분양정보 수집
        id: cy
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python fetch_cy.py
      - name: 청약 지도 만들기
        continue-on-error: true
        run: |
          mkdir -p site/cheongyak
          if [ -f cy_data.json ]; then
            python build_cy.py cy_data.json rt_data.json site/cheongyak/index.html site/cheongyak/summary.json --standalone
          else
            echo '::warning::청약홈 수집 실패 - 어제 청약 지도를 그대로 둡니다'
            curl -sf https://gogokimbiz-spec.github.io/sudogwon-rt/cheongyak/index.html -o site/cheongyak/index.html || true
            curl -sf https://gogokimbiz-spec.github.io/sudogwon-rt/cheongyak/summary.json -o site/cheongyak/summary.json || true
          fi
      - name: 청약 주간 블로그 글 (월요일)
        if: steps.cy.outcome == 'success'
        continue-on-error: true
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ secrets.ADSENSE_SLOT }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ] || [ "${{ inputs.cy_weekly }}" = "true" ]; then
            python fetch_news_cy.py site/cheongyak/summary.json || echo '청약 뉴스 단계 실패 - 뉴스 없이 계속'
            python post_blogger_cy.py site/cheongyak/summary.json
          else
            echo '월요일이 아니라 청약 주간 글은 건너뜁니다'
          fi
      - name: 오늘의 부동산 뉴스 고르기
        run: python fetch_news.py site/summary.json || echo '뉴스 단계 실패 - 뉴스 없이 계속'
      - name: 블로거에 오늘 글 올리기
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ secrets.ADSENSE_SLOT }}
        run: python post_blogger.py site/summary.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  notify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 오늘 요약 받기
        run: sleep 60; curl -sf "${{ needs.deploy.outputs.page_url }}summary.json?t=$(date +%s)" -o summary.json || curl -sf "https://gogokimbiz-spec.github.io/sudogwon-rt/summary.json?t=$(date +%s)" -o summary.json
      - name: 카카오톡 나에게 보내기
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 kakao_send.py summary.json
      - name: 청약 주간 카톡 (월요일)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ] || [ "${{ inputs.cy_weekly }}" = "true" ]; then
            curl -sf "${{ needs.deploy.outputs.page_url }}cheongyak/summary.json?t=$(date +%s)" -o cy_summary.json || curl -sf "https://gogokimbiz-spec.github.io/sudogwon-rt/cheongyak/summary.json?t=$(date +%s)" -o cy_summary.json
            python3 kakao_send_cy.py cy_summary.json
          else
            echo '월요일이 아니라 청약 카톡은 건너뜁니다'
          fi

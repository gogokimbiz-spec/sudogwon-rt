name: 매일 실거래 갱신

on:
  schedule:
    - cron: '11 20 * * *'   # 매일 05:11 KST
    - cron: '41 22 * * *'   # 07:41 KST 예비 실행 – 오늘 실행이 이미 성공(또는 진행 중)이면 스스로 취소, 새벽 실행이 GitHub 장애로 실패한 날만 대신 돎
  workflow_dispatch:         # Actions 탭에서 수동 실행
    inputs:
      cy_post:
        description: '청약 블로그 글·카톡 지금 보내기 (mon=이번 주 일정, tue=청약 결과, wed=줍줍·로또, thu=가점 커트라인, fri=단지분석)'
        type: choice
        options: ['none', 'mon', 'tue', 'wed', 'thu', 'fri']
        default: 'none'
      fin_post:
        description: '기업재무 글·카톡 지금 보내기 (rank=순위, value=저평가 지표)'
        type: choice
        options: ['none', 'rank', 'value']
        default: 'none'
      region_post:
        description: '동네 대표기업 인스타·스레드 게시물 지금 만들기 (next=이번 차례, 또는 지역 지정 – 게시는 인스타·스레드 실행 때)'
        type: choice
        options: ['none', 'next', 'gangnam', 'seocho', 'songpa', 'yongsan', 'seongdong', 'mapo', 'bundang', 'gwacheon', 'yeongtong', 'suji', 'dongtan', 'yeonsu']
        default: 'none'
      trend_post:
        description: '구별 상승률 블로그 글 지금 올리기 (week=최근 4주 TOP 10, month=지난달 순위) – 평소엔 매주 월요일 주간·매월 첫째 월요일 월간 자동'
        type: choice
        options: ['none', 'week', 'month']
        default: 'none'

permissions:
  contents: write   # 카드 이미지 보관용
  actions: write    # 예비 실행이 스스로 취소할 때 사용
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:   # 07:41 예비 실행일 때만: 오늘(한국 날짜) 이미 성공했거나 돌고 있는 실행이 있으면 이 실행을 취소
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "41 22 * * *" ]; then
            SINCE=$(date -u -d "$(TZ=Asia/Seoul date +%Y-%m-%d) 00:00 +0900" +%Y-%m-%dT%H:%M:%SZ)
            N=$(gh api "repos/${{ github.repository }}/actions/workflows/daily.yml/runs?per_page=50&created=%3E%3D${SINCE}" \
                --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion == "success" or .status == "in_progress" or .status == "queued" or .status == "waiting")] | length')
            echo "오늘($SINCE 이후) 이미 성공·진행 중인 실행: $N"
            if [ "$N" != "0" ]; then
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo '오늘 실행이 이미 있어 예비 실행을 취소합니다'
              gh run cancel ${{ github.run_id }} -R ${{ github.repository }}; sleep 60
              exit 0
            fi
            echo '새벽 실행이 없거나 실패해서 예비 실행으로 대신 돌립니다'
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 국토부 실거래 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python fetch.py
      - name: 지도 페이지 만들기
        env:
          WATCH_DAYS: ${{ vars.WATCH_DAYS }}
          WATCH_FIXED: ${{ vars.WATCH_FIXED }}
        run: |
          mkdir -p site
          python build.py rt_data.json site/index.html site/summary.json --standalone
          cp privacy.html site/ 2>/dev/null || true
          [ -d unse ] && cp -r unse site/ || true   # 내 집 마련 타로
          # 검색엔진 소유 확인 파일과 사이트맵 (있으면 같이 올림)
          for f in google*.html naver*.html sitemap.xml robots.txt; do [ -f "$f" ] && cp "$f" site/ || true; done
      - name: 오늘의 신고가 카드 이미지 만들기
        continue-on-error: true
        run: |
          # 한글 폰트: 저장소 fonts/ 폴더의 Noto Sans KR 을 씀 (인터넷 설치가 실패해도 카드가 만들어지도록)
          sudo mkdir -p /usr/share/fonts/noto-kr && sudo cp fonts/NotoSansCJKkr-*.otf /usr/share/fonts/noto-kr/
          pip install -q pillow
          # 단지별 카드의 최근 3년 거래 그래프용 과거 실거래 (hist/ 에 쌓아 두고 다시 안 받음)
          DATA_GO_KR_KEY="${{ secrets.DATA_GO_KR_KEY }}" python fetch_hist.py site/summary.json || echo '과거 거래 수집 실패 - 그래프 없이 계속'
          python make_cards.py site/summary.json site/cards hist rt_data.json
          # 주요 지역 신고가 1위 카드 (브이월드 위성 사진 배경, 못 받으면 일반 배경)
          VWORLD_KEY="${{ secrets.VWORLD_KEY }}" python make_hero.py site/summary.json site/cards || echo '1위 카드 실패 - 건너뜀'
          cp site/cards/single.png site/cards/latest.png
      - name: 시군구별 실거래가 페이지 만들기
        continue-on-error: true
        run: python build_regions.py rt_data.json site
      - name: 구별 상승률 계산·카드 (주간 4주·월간)
        continue-on-error: true
        run: |
          sudo mkdir -p /usr/share/fonts/noto-kr && sudo cp fonts/NotoSansCJKkr-*.otf /usr/share/fonts/noto-kr/
          pip install -q pillow
          python build_trend.py rt_data.json site
      - name: 청약홈 분양정보 수집
        id: cy
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python fetch_cy.py
      - name: 청약 지도 만들기
        continue-on-error: true
        run: |
          mkdir -p site/cheongyak
          if [ -f cy_data.json ]; then
            python build_cy.py cy_data.json rt_data.json site/cheongyak/index.html site/cheongyak/summary.json --standalone
          else
            echo '::warning::청약홈 수집 실패 - 어제 청약 지도를 그대로 둡니다'
            curl -sf https://gogokimbiz-spec.github.io/sudogwon-rt/cheongyak/index.html -o site/cheongyak/index.html || true
            curl -sf https://gogokimbiz-spec.github.io/sudogwon-rt/cheongyak/summary.json -o site/cheongyak/summary.json || true
          fi
      - name: 상장사 재무 데이터 확인 (PC 실행기가 04:31 에 올린 것)
        id: fin
        continue-on-error: true
        run: |
          # 금융위원회 API 는 해외 접속이 막혀 있어 fin_fetch.yml 이 사장님 PC 에서 받아 저장소에 올립니다.
          python -c "import json,datetime,sys;d=json.load(open('fin_data.json',encoding='utf-8'));t=(datetime.datetime.utcnow()+datetime.timedelta(hours=9)).date().isoformat();print('재무 데이터 기준', d['asof'], '/ 오늘', t);sys.exit(0 if d['asof']==t else 1)" \
            || { echo '::warning::오늘 재무 데이터가 없습니다 (PC 꺼짐 등) - 어제 재무 페이지를 그대로 두고 재무 글·카톡은 건너뜁니다'; rm -f fin_data.json; exit 1; }
      - name: 기업 재무 페이지 만들기
        continue-on-error: true
        env:
          FIN_POST: ${{ inputs.fin_post }}
        run: |
          if [ -f fin_data.json ]; then
            python build_fin.py fin_data.json site
          else
            echo '::warning::상장사 수집 실패 - 어제 재무 페이지를 그대로 둡니다'
            mkdir -p site/fin
            curl -sf https://gogokimbiz-spec.github.io/sudogwon-rt/fin/index.html -o site/fin/index.html || true
            curl -sf https://gogokimbiz-spec.github.io/sudogwon-rt/fin/summary.json -o site/fin/summary.json || true
          fi
      - name: 기업재무 카드 이미지 만들기 (토)
        if: steps.fin.outcome == 'success'
        continue-on-error: true
        run: |
          # 한글 폰트: 저장소 fonts/ 폴더의 Noto Sans KR 을 씀 (인터넷 설치가 실패해도 카드가 만들어지도록)
          sudo mkdir -p /usr/share/fonts/noto-kr && sudo cp fonts/NotoSansCJKkr-*.otf /usr/share/fonts/noto-kr/
          pip install -q pillow
          python make_cards_fin.py site/fin/summary.json site/fin/cards
      - name: 동네 대표기업 지역 고르기·카드 (목, 인스타·스레드용)
        id: dong
        continue-on-error: true
        env:
          REGION_POST: ${{ inputs.region_post }}
        run: |
          # region_data.json 은 PC 실행기(fin_fetch.yml)가 매일 04:31 에 올림
          if [ ! -f region_data.json ]; then echo '동네 대표기업 자료가 아직 없습니다'; exit 0; fi
          [ "$REGION_POST" = "none" ] && export REGION_POST=''
          python build_region.py region_data.json site
          sudo mkdir -p /usr/share/fonts/noto-kr && sudo cp fonts/NotoSansCJKkr-*.otf /usr/share/fonts/noto-kr/
          pip install -q pillow
          python make_cards_region.py site/dong/summary.json site/dong/cards
      - name: 이번 주 청약 카드 이미지 만들기
        continue-on-error: true
        run: |
          # 한글 폰트: 저장소 fonts/ 폴더의 Noto Sans KR 을 씀 (인터넷 설치가 실패해도 카드가 만들어지도록)
          sudo mkdir -p /usr/share/fonts/noto-kr && sudo cp fonts/NotoSansCJKkr-*.otf /usr/share/fonts/noto-kr/
          pip install -q pillow
          python make_cards_cy.py site/cheongyak/summary.json site/cheongyak/cards
          # 화(청약 결과)·수(줍줍·로또)·목(가점 커트라인)·금(단지분석, 폴더 cards_sat) – 매일 만들어 두고 인스타·블로그·카톡 이미지에 씀
          python make_cards_cy2.py site/cheongyak/summary.json site/cheongyak/cards_tue --mode=tue || echo '화요일 청약 카드 실패'
          python make_cards_cy2.py site/cheongyak/summary.json site/cheongyak/cards_wed --mode=wed || echo '수요일 청약 카드 실패'
          python make_cards_cy2.py site/cheongyak/summary.json site/cheongyak/cards_thu --mode=thu || echo '목요일 청약 카드 실패'
          python make_cards_cy2.py site/cheongyak/summary.json site/cheongyak/cards_sat --mode=sat || echo '토요일 청약 카드 실패'
      - name: 인스타 게시용 페이지 만들기 (/insta/)
        continue-on-error: true
        run: python build_insta.py site
      - name: 카드 이미지 보관 (블로그 대표 이미지용)
        continue-on-error: true
        run: |
          D=$(python -c "import json;print(json.load(open('site/summary.json'))['day'])")
          mkdir -p cards/rt cards/cy cards/fin cards/dong
          if [ -f site/dong/cards/single.png ]; then
            RD=$(python -c "import json;print(json.load(open('site/dong/summary.json'))['day'])") && cp site/dong/cards/single.png "cards/dong/$RD.png"
          fi
          if [ -f site/fin/cards/single.png ]; then
            FD=$(python -c "import json;print(json.load(open('site/fin/summary.json'))['day'])") && cp site/fin/cards/single.png "cards/fin/$FD.png"
          fi
          [ -f site/cards/single.png ] && cp site/cards/single.png "cards/rt/$D.png"
          [ -f site/cards/hero.png ] && cp site/cards/hero.png "cards/rt/${D}_hero.png"
          DOW=$(TZ=Asia/Seoul date +%u); CYP="${{ inputs.cy_post }}"
          if [ "$DOW" = "1" ] || [ "$CYP" = "mon" ]; then
            W=$(python -c "import json;print(json.load(open('site/cheongyak/summary.json'))['week'][0])" 2>/dev/null) || W=''
            [ -n "$W" ] && [ -f site/cheongyak/cards/single.png ] && cp site/cheongyak/cards/single.png "cards/cy/$W.png"
          fi
          if [ "$DOW" = "2" ] || [ "$CYP" = "tue" ]; then
            W=$(python -c "import json;print(json.load(open('site/cheongyak/summary.json'))['tue'])" 2>/dev/null) || W=''
            [ -n "$W" ] && [ -f site/cheongyak/cards_tue/01.png ] && cp site/cheongyak/cards_tue/01.png "cards/cy/${W}_tue.png"
          fi
          if [ "$DOW" = "4" ] || [ "$CYP" = "thu" ]; then
            W=$(python -c "import json;print(json.load(open('site/cheongyak/summary.json'))['thu'])" 2>/dev/null) || W=''
            [ -n "$W" ] && [ -f site/cheongyak/cards_thu/01.png ] && cp site/cheongyak/cards_thu/01.png "cards/cy/${W}_thu.png"
          fi
          if [ "$DOW" = "3" ] || [ "$CYP" = "wed" ]; then
            W=$(python -c "import json;print(json.load(open('site/cheongyak/summary.json'))['wed'])" 2>/dev/null) || W=''
            [ -n "$W" ] && [ -f site/cheongyak/cards_wed/01.png ] && cp site/cheongyak/cards_wed/01.png "cards/cy/${W}_wed.png"
          fi
          if [ "$DOW" = "5" ] || [ "$CYP" = "fri" ]; then
            W=$(python -c "import json;print(json.load(open('site/cheongyak/summary.json'))['fri'])" 2>/dev/null) || W=''
            [ -n "$W" ] && [ -f site/cheongyak/cards_sat/01.png ] && cp site/cheongyak/cards_sat/01.png "cards/cy/${W}_fri.png"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 구별 상승률 카드 (매주 월요일 주간 · 매월 첫째 월요일 월간 · 수동 trend_post)
          TP="${{ inputs.trend_post }}"; TM=""
          if [ -n "$TP" ] && [ "$TP" != "none" ]; then TM="$TP"; else
            if [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then
              TM="week"                                                     # 매주 월요일: 주간
              [ "$(TZ=Asia/Seoul date +%-d)" -le 7 ] && TM="week month"     # 매월 첫째 월요일: 월간도
            fi
          fi
          mkdir -p cards/trend
          for m in $TM; do
            K=$(python -c "import json;print(json.load(open('site/trend/summary.json'))['$m']['key'])" 2>/dev/null) || K=''
            [ -n "$K" ] && [ -f "site/trend/$m.png" ] && cp "site/trend/$m.png" "cards/trend/$K.png"
          done
          git add cards hist
          if ! git diff --cached --quiet; then
            git commit -q -m "카드 이미지 $D"
            git pull -q --rebase --autostash && git push -q
          fi
      - name: 청약 블로그 글 (월~금)
        if: steps.cy.outcome == 'success'
        continue-on-error: true
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ secrets.ADSENSE_SLOT }}
        run: |
          # 월: 이번 주 청약 일정 / 화: 청약 결과 / 수: 줍줍·로또 / 목: 당첨 가점 커트라인 / 금: 단지분석 (수동 실행 때는 cy_post 선택값)
          M="${{ inputs.cy_post }}"
          if [ -z "$M" ] || [ "$M" = "none" ]; then
            case "$(TZ=Asia/Seoul date +%u)" in 1) M=mon;; 2) M=tue;; 3) M=wed;; 4) M=thu;; 5) M=fri;; *) M=none;; esac
          fi
          if [ "$M" = "none" ]; then echo '오늘은 청약 글이 없는 요일입니다'; exit 0; fi
          [ "$M" = "mon" ] && { python fetch_news_cy.py site/cheongyak/summary.json || echo '청약 뉴스 단계 실패 - 뉴스 없이 계속'; }
          python post_blogger_cy.py site/cheongyak/summary.json --mode=$M
      - name: 기업재무 블로그 글 (토)
        if: steps.fin.outcome == 'success'
        continue-on-error: true
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ secrets.ADSENSE_SLOT }}
        run: python post_blogger_fin.py site/fin/summary.json
      - name: 구별 상승률 블로그 글 (매주 월요일 주간 · 매월 첫째 월요일 월간)
        continue-on-error: true
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ secrets.ADSENSE_SLOT }}
        run: |
          TP="${{ inputs.trend_post }}"; TM=""
          if [ -n "$TP" ] && [ "$TP" != "none" ]; then TM="$TP"; else
            if [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then
              TM="week"                                                     # 매주 월요일: 주간
              [ "$(TZ=Asia/Seoul date +%-d)" -le 7 ] && TM="week month"     # 매월 첫째 월요일: 월간도
            fi
          fi
          if [ -z "$TM" ]; then echo '오늘은 구별 상승률 글이 없는 날입니다'; exit 0; fi
          for m in $TM; do python post_blogger_trend.py site/trend/summary.json --mode=$m; done
      - name: 오늘의 부동산 뉴스 고르기
        run: python fetch_news.py site/summary.json || echo '뉴스 단계 실패 - 뉴스 없이 계속'
      - name: 블로거에 오늘 글 올리기
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ secrets.ADSENSE_SLOT }}
        run: python post_blogger.py site/summary.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      # GitHub Pages 쪽 일시 오류("Deployment failed, try again later")가 가끔 나서, 실패하면 1분 뒤 한 번 더 시도
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
  notify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 오늘 요약 받기
        run: sleep 60; curl -sf "${{ needs.deploy.outputs.page_url }}summary.json?t=$(date +%s)" -o summary.json || curl -sf "https://gogokimbiz-spec.github.io/sudogwon-rt/summary.json?t=$(date +%s)" -o summary.json
      - name: 카카오톡 나에게 보내기
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 kakao_send.py summary.json
      - name: 텔레그램 채널에 올리기
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 telegram_send.py summary.json
      - name: 청약 카톡 (월~금)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          M="${{ inputs.cy_post }}"
          if [ -z "$M" ] || [ "$M" = "none" ]; then
            case "$(TZ=Asia/Seoul date +%u)" in 1) M=mon;; 2) M=tue;; 3) M=wed;; 4) M=thu;; 5) M=fri;; *) M=none;; esac
          fi
          if [ "$M" != "none" ]; then
            curl -sf "${{ needs.deploy.outputs.page_url }}cheongyak/summary.json?t=$(date +%s)" -o cy_summary.json || curl -sf "https://gogokimbiz-spec.github.io/sudogwon-rt/cheongyak/summary.json?t=$(date +%s)" -o cy_summary.json
            python3 kakao_send_cy.py cy_summary.json --mode=$M
            if [ "$M" = "mon" ]; then
              TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" python3 telegram_send.py cy_summary.json --cy || echo '청약 텔레그램 실패'
            fi
          else
            echo '주말이라 청약 카톡은 건너뜁니다'
          fi
      - name: 기업재무 카톡 (토)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -sf "${{ needs.deploy.outputs.page_url }}fin/summary.json?t=$(date +%s)" -o fin_summary.json || curl -sf "https://gogokimbiz-spec.github.io/sudogwon-rt/fin/summary.json?t=$(date +%s)" -o fin_summary.json
          python3 kakao_send_fin.py fin_summary.json
